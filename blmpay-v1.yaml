openapi: 3.1.0
info:
  title: BLMPay REST API
  version: 1.1.0
  description: |
    DEPRECATED: BLMPay API v1 is legacy and is scheduled to be retired on 15 November 2026 at 23:59 EAT. Migrate to API v2 HMAC before this date.

    Official BLMPay merchant API v1 for collections, payouts, payment links, invoices, webhooks and USDT.

    Authentication uses a BLMPay API key in the Authorization Bearer header.
    API keys may also be domain-bound. For a domain-bound server-to-server key,
    send X-BLMPay-Origin with the same HTTPS integration URL/host saved in BLMPay.
    Browser requests may be identified through Origin or Referer. Existing legacy
    keys without a configured domain remain backward compatible.
servers:
  - url: https://pay.blmtec.co.tz/api/v1
security:
  - bearerAuth: []
x-blmpay-deprecated: true
x-blmpay-sunset: '2026-11-15T23:59:59+03:00'
x-blmpay-successor: https://pay.blmtec.co.tz/api/v2
x-blmpay-domain-bound-api-keys:
  header: X-BLMPay-Origin
  requiredWhen: API key has an allowed domain configured and request has no usable Origin/Referer header
  example: https://example.com
  mismatchError: integration_domain_not_allowed
  missingError: integration_origin_required
tags:
  - name: Payments
  - name: Balance
  - name: Payment Links
  - name: Invoices
  - name: Payouts
  - name: Webhooks
  - name: USDT
paths:
  /payments:
    get:
      tags: [Payments]
      operationId: listPayments
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - name: status
          in: query
          schema: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
    post:
      tags: [Payments]
      operationId: createPayment
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
        - {$ref: '#/components/parameters/IdempotencyKeyOptional'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePaymentRequest'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /payments/{reference}:
    get:
      tags: [Payments]
      operationId: getPayment
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
        - {$ref: '#/components/parameters/Reference'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
        '404': {$ref: '#/components/responses/Error'}
  /balance:
    get:
      tags: [Balance]
      operationId: getBalance
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /payment-links:
    get:
      tags: [Payment Links]
      operationId: listPaymentLinks
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
    post:
      tags: [Payment Links]
      operationId: createPaymentLink
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePaymentLinkRequest'}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
    post:
      tags: [Invoices]
      operationId: createInvoice
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInvoiceRequest'}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /payouts:
    get:
      tags: [Payouts]
      operationId: listPayouts
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - name: status
          in: query
          schema: {type: string}
        - name: source
          in: query
          schema: {type: string, enum: [all, api, dashboard], default: all}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /payouts/{reference}:
    get:
      tags: [Payouts]
      operationId: getPayout
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
        - {$ref: '#/components/parameters/Reference'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
        '404': {$ref: '#/components/responses/Error'}
  /payouts/fee:
    get:
      tags: [Payouts]
      operationId: getPayoutFee
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
        - name: amount
          in: query
          required: true
          schema: {type: integer, minimum: 1}
        - name: channel
          in: query
          schema: {type: string, enum: [mobile, bank, selcompesa], default: mobile}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /payouts/banks:
    get:
      tags: [Payouts]
      operationId: listPayoutBanks
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /payouts/name-lookup:
    post:
      tags: [Payouts]
      operationId: payoutNameLookup
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PayoutLookupRequest'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /payouts/send:
    post:
      tags: [Payouts]
      operationId: createPayout
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
        - {$ref: '#/components/parameters/IdempotencyKeyRequired'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePayoutRequest'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
    post:
      tags: [Webhooks]
      operationId: createWebhook
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWebhookRequest'}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /webhooks/{id}:
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
        - name: id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /usdt/activate:
    post:
      tags: [USDT]
      operationId: activateUsdt
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /usdt/address:
    get:
      tags: [USDT]
      operationId: getUsdtAddress
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /usdt/transfers:
    get:
      tags: [USDT]
      operationId: listUsdtTransfers
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /usdt/withdrawals/quote:
    post:
      tags: [USDT]
      operationId: quoteUsdtWithdrawal
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
        - {$ref: '#/components/parameters/IdempotencyKeyRequired'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, amount]
              properties:
                address: {type: string}
                amount: {oneOf: [{type: string}, {type: number}]}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
  /usdt/withdrawals:
    post:
      tags: [USDT]
      operationId: confirmUsdtWithdrawal
      parameters:
        - {$ref: '#/components/parameters/IntegrationOrigin'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_reference]
              properties:
                quote_reference: {type: string}
      responses:
        '201': {$ref: '#/components/responses/Success'}
        '403': {$ref: '#/components/responses/DomainRestrictionError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: BLMPay API key
  parameters:
    IntegrationOrigin:
      name: X-BLMPay-Origin
      in: header
      required: false
      description: Required for domain-bound server-to-server API keys when Origin/Referer is not available. Must identify the same HTTPS integration host saved on the API key. Legacy keys without an allowed domain do not require this header.
      schema:
        type: string
        format: uri
        pattern: '^https://'
      example: https://example.com
    Reference:
      name: reference
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 8, maxLength: 30}
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 100}
  schemas:
    CreatePaymentRequest:
      type: object
      required: [payment_type, details]
      properties:
        payment_type: {type: string, enum: [mobile, card, dynamic-qr]}
        phone_number: {type: string}
        customer_name: {type: string}
        customer_email: {type: string, format: email}
        first_name: {type: string}
        last_name: {type: string}
        description: {type: string}
        webhook_url: {type: string, format: uri}
        metadata: {type: object, additionalProperties: true}
        customer: {type: object, additionalProperties: true}
        details:
          type: object
          required: [amount]
          properties:
            amount: {type: integer, minimum: 500}
            currency: {type: string, enum: [TZS], default: TZS}
          additionalProperties: true
      additionalProperties: true
    CreatePaymentLinkRequest:
      type: object
      required: [title]
      properties:
        title: {type: string}
        description: {type: string}
        amount: {type: integer, nullable: true}
        allow_custom_amount: {type: boolean}
        min_amount: {type: integer, default: 500}
        max_amount: {type: integer, default: 1000000}
        allowed_methods:
          type: array
          items: {type: string, enum: [mobile_money, card, qr]}
    CreateInvoiceRequest:
      type: object
      required: [items]
      properties:
        customer_name: {type: string}
        customer_email: {type: string, format: email}
        customer_phone: {type: string}
        tax_percent: {type: number, minimum: 0}
        payment_mode: {type: string, enum: [automatic, manual, both], default: automatic}
        due_date: {type: string}
        expires_at: {type: string}
        notes: {type: string}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, unit_price]
            properties:
              name: {type: string}
              quantity: {type: integer, minimum: 1, default: 1}
              unit_price: {type: integer, minimum: 0}
    PayoutLookupRequest:
      type: object
      required: [channel]
      properties:
        channel: {type: string, enum: [mobile, bank, selcompesa]}
        account_number: {type: string}
        phone_number: {type: string}
        wallet_number: {type: string}
        bank_code: {type: string}
    CreatePayoutRequest:
      type: object
      required: [amount, channel]
      properties:
        amount: {type: integer, minimum: 1}
        currency: {type: string, enum: [TZS], default: TZS}
        channel: {type: string, enum: [mobile, bank, selcompesa]}
        recipient_phone: {type: string}
        wallet_number: {type: string}
        network: {type: string}
        recipient_bank: {type: string}
        recipient_account: {type: string}
        recipient_name: {type: string, description: Compatibility field; BLMPay performs its own recipient lookup.}
        narration: {type: string, maxLength: 300}
        webhook_url: {type: string, format: uri}
        metadata: {type: object, additionalProperties: true}
      additionalProperties: false
    CreateWebhookRequest:
      type: object
      required: [url]
      properties:
        name: {type: string}
        url: {type: string, format: uri, pattern: '^https://'}
        events:
          type: array
          items:
            type: string
            enum: [payment.completed, payment.failed, payment.voided, payment.expired, payout.completed, payout.failed, payout.reversed, usdt.received]
  responses:
    Success:
      description: Successful BLMPay API response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: BLMPay API error.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: {type: string, example: error}
              code: {type: integer}
              error_code: {type: string}
              message: {type: string}
            additionalProperties: true
    DomainRestrictionError:
      description: API key domain restriction failed. The key may require X-BLMPay-Origin, or the supplied/request origin host does not match the allowed domain.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: {type: string, example: error}
              code: {type: integer, example: 403}
              error_code:
                type: string
                enum: [integration_origin_required, integration_domain_not_allowed, integration_pending_review, integration_rejected]
              message: {type: string}
            additionalProperties: true
